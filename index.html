<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Personal academic homepage.">
    <meta name="theme-color" content="#ffffff">
    <title>About me</title>
    <link rel="icon" href="./assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="./assets/js/content.js" defer></script>
    <script src="./assets/js/site.js" defer></script>
  </head>
  <body data-page="home" data-root="./">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="masthead" id="site-header"></header>
    <div class="site-layout">
      <aside class="sidebar" id="profile-sidebar" aria-label="Profile"></aside>
      <main id="main-content" class="page-content" tabindex="-1">
        <h1>About me</h1>
        <div id="about-content" class="section-copy">
          <div class="empty-copy" role="img" aria-label="Biography left blank">
            <span class="blank-line wide"></span><span class="blank-line medium"></span>
          </div>
        </div>
        <section aria-labelledby="research-heading">
          <h2 id="research-heading" class="section-heading">Research</h2>
          <div id="research-content" class="section-copy">
            <div class="empty-copy" role="img" aria-label="Research interests left blank">
              <span class="blank-line wide"></span><span class="blank-line short"></span>
            </div>
          </div>
        </section>
        <section aria-labelledby="service-heading">
          <h2 id="service-heading" class="section-heading"></h2>
          <div id="service-content" class="section-copy">
            <div class="empty-copy compact" role="img" aria-label="Professional service left blank">
              <span class="blank-line medium"></span>
            </div>
          </div>
        </section>
      </main>
    </div>
    <footer class="site-footer" id="site-footer"></footer>
    <noscript><p class="noscript-note">Enable JavaScript to display the profile and navigation.</p></noscript>
  </body>
</html>
