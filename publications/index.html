<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Academic publications.">
    <meta name="theme-color" content="#ffffff">
    <title>Selected Publications</title>
    <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/content.js" defer></script>
    <script src="../assets/js/site.js" defer></script>
  </head>
  <body data-page="publications" data-root="../">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="masthead" id="site-header"></header>
    <div class="site-layout">
      <aside class="sidebar" id="profile-sidebar" aria-label="Profile"></aside>
      <main id="main-content" class="page-content" tabindex="-1">
        <h1>Selected Publications</h1>
        <div id="publications-content" class="record-list">
          <div class="empty-record" role="img" aria-label="Publication details left blank">
            <span class="blank-line title-line"></span><span class="blank-line medium"></span>
            <span class="blank-line short"></span>
          </div>
          <div class="empty-record" aria-hidden="true">
            <span class="blank-line title-line shorter"></span><span class="blank-line wide"></span>
            <span class="blank-line short"></span>
          </div>
        </div>
      </main>
    </div>
    <footer class="site-footer" id="site-footer"></footer>
    <noscript><p class="noscript-note">Enable JavaScript to display the profile and navigation.</p></noscript>
  </body>
</html>
